<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Beach Coffee Control</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --line: #e5e1da;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --danger: #b42318;
    --done: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --card: #1d2125;
      --text: #eceff1;
      --muted: #9aa4ad;
      --line: #2c3238;
      --accent: #2dd4bf;
      --accent-soft: #134e4a;
      --danger: #f97066;
      --done: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    justify-content: space-between;
  }
  h1 { margin: 0; font-size: 1.3rem; }
  h1 small { display: block; font-size: .8rem; font-weight: 400; color: var(--muted); }
  h2 { margin: 0 0 12px; font-size: 1.05rem; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 32px;
    display: grid;
    gap: 16px;
  }
  @media (min-width: 860px) {
    main { grid-template-columns: 1.2fr 1fr; }
    .full { grid-column: 1 / -1; }
  }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    min-width: 0;
  }
  input, select, button { font: inherit; color: inherit; }
  input[type="text"], input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .drinks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .drink {
    border: 2px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 14px 10px;
    cursor: pointer;
    text-align: center;
    transition: transform .05s, border-color .15s;
  }
  .drink:active { transform: scale(.97); }
  .drink:hover { border-color: var(--accent); }
  .drink .emoji { font-size: 2rem; display: block; }
  .drink .name { font-weight: 600; display: block; }
  .drink .count { font-size: .85rem; color: var(--muted); }
  .btn {
    border: 1px solid var(--line);
    background: var(--bg);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: .85rem; }
  .btn.danger { color: var(--danger); }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }
  .stat {
    background: var(--bg);
    border-radius: 10px;
    padding: 10px;
  }
  .stat .label { font-size: .8rem; color: var(--muted); }
  .stat .value { font-size: 1.6rem; font-weight: 700; }
  .stat.total { background: var(--accent-soft); }
  ul.orders { list-style: none; margin: 0; padding: 0; }
  ul.orders li {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  ul.orders li:last-child { border-bottom: 0; }
  ul.orders .info { flex: 1; min-width: 0; }
  ul.orders .info strong { display: block; }
  ul.orders .info span { font-size: .85rem; color: var(--muted); }
  ul.orders li.done .info strong { text-decoration: line-through; color: var(--muted); }
  .badge {
    font-size: .75rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
  }
  .empty { color: var(--muted); font-style: italic; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  tfoot td { font-weight: 700; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>☕ Beach Coffee Control<small>Island DAO — pedidos de café</small></h1>
  <div class="row">
    <label for="day">Dia</label>
    <input type="date" id="day" style="width:auto">
    <button class="btn" id="today">Hoje</button>
  </div>
</header>

<main>
  <section>
    <h2>Novo pedido</h2>
    <input type="text" id="customer" placeholder="Nome do cliente (opcional)" autocomplete="off">
    <div class="drinks" id="drinks"></div>
  </section>

  <section>
    <h2>Bebidas do dia</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section class="full">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Pedidos do dia</h2>
      <div class="row">
        <label class="row" style="gap:4px;font-size:.9rem">
          <input type="checkbox" id="hideDone"> esconder prontos
        </label>
      </div>
    </div>
    <ul class="orders" id="orders"></ul>
  </section>

  <section class="full">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Resumo por dia</h2>
      <div class="row">
        <button class="btn" id="exportCsv">Exportar CSV</button>
        <button class="btn danger" id="clearDay">Apagar dia</button>
      </div>
    </div>
    <div class="table-wrap" id="summary"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  const DRINKS = [
    { id: "espresso",   name: "Espresso",        emoji: "☕" },
    { id: "latte",      name: "Latte",           emoji: "🥛" },
    { id: "cappuccino", name: "Cappuccino",      emoji: "☁️" },
    { id: "americano",  name: "Americano",       emoji: "🫗" },
    { id: "matcha",     name: "Matcha",          emoji: "🍵" },
    { id: "chocolate",  name: "Chocolate quente", emoji: "🍫" },
  ];
  const STORAGE_KEY = "beach-coffee-control:v1";

  // Data shape: { orders: [{ id, drink, customer, day: "YYYY-MM-DD", time: ISO, done }] }
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (data && Array.isArray(data.orders)) return data;
    } catch (e) {}
    return { orders: [] };
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      toast("Não foi possível salvar no navegador");
    }
  }

  function localDay(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  function formatDay(day) {
    const [y, m, d] = day.split("-");
    return `${d}/${m}/${y}`;
  }
  function formatTime(iso) {
    return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
  const drinkById = id => DRINKS.find(d => d.id === id) || { name: id, emoji: "❓" };
  const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const state = load();
  const $ = id => document.getElementById(id);
  const dayInput = $("day");
  dayInput.value = localDay();

  function ordersFor(day) {
    return state.orders.filter(o => o.day === day);
  }
  function countByDrink(orders) {
    const counts = Object.fromEntries(DRINKS.map(d => [d.id, 0]));
    for (const o of orders) counts[o.drink] = (counts[o.drink] || 0) + 1;
    return counts;
  }

  function addOrder(drinkId) {
    const day = dayInput.value || localDay();
    const customer = $("customer").value.trim();
    state.orders.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      drink: drinkId,
      customer,
      day,
      time: new Date().toISOString(),
      done: false,
    });
    save();
    $("customer").value = "";
    toast(`${drinkById(drinkId).name} adicionado${customer ? " para " + customer : ""}`);
    render();
  }

  function render() {
    const day = dayInput.value || localDay();
    const orders = ordersFor(day);
    const counts = countByDrink(orders);

    $("drinks").innerHTML = DRINKS.map(d => `
      <button class="drink" data-drink="${d.id}">
        <span class="emoji">${d.emoji}</span>
        <span class="name">${d.name}</span>
        <span class="count">${counts[d.id]} no dia</span>
      </button>`).join("");

    $("stats").innerHTML =
      `<div class="stat total"><div class="label">Total</div><div class="value">${orders.length}</div></div>` +
      DRINKS.map(d => `
        <div class="stat"><div class="label">${d.emoji} ${d.name}</div><div class="value">${counts[d.id]}</div></div>`).join("");

    const hideDone = $("hideDone").checked;
    const visible = orders.filter(o => !(hideDone && o.done)).reverse();
    $("orders").innerHTML = visible.length
      ? visible.map(o => {
          const d = drinkById(o.drink);
          return `
          <li class="${o.done ? "done" : ""}">
            <span style="font-size:1.5rem">${d.emoji}</span>
            <div class="info">
              <strong>${d.name}</strong>
              <span>${o.customer ? escapeHtml(o.customer) + " · " : ""}${formatTime(o.time)}</span>
            </div>
            ${o.done ? '<span class="badge">pronto</span>' : ""}
            <button class="btn small" data-toggle="${o.id}">${o.done ? "Desfazer" : "Pronto"}</button>
            <button class="btn small danger" data-delete="${o.id}" aria-label="Remover">✕</button>
          </li>`;
        }).join("")
      : `<li class="empty">Nenhum pedido ${hideDone && orders.length ? "pendente" : "neste dia"}.</li>`;

    renderSummary();
  }

  function renderSummary() {
    const days = [...new Set(state.orders.map(o => o.day))].sort().reverse();
    if (!days.length) {
      $("summary").innerHTML = '<p class="empty">Ainda não há pedidos registrados.</p>';
      return;
    }
    const totals = Object.fromEntries(DRINKS.map(d => [d.id, 0]));
    const rows = days.map(day => {
      const counts = countByDrink(ordersFor(day));
      let sum = 0;
      const cells = DRINKS.map(d => { totals[d.id] += counts[d.id]; sum += counts[d.id]; return `<td>${counts[d.id]}</td>`; }).join("");
      return `<tr><td>${formatDay(day)}</td>${cells}<td><strong>${sum}</strong></td></tr>`;
    }).join("");
    const grand = Object.values(totals).reduce((a, b) => a + b, 0);
    $("summary").innerHTML = `
      <table>
        <thead><tr><th>Dia</th>${DRINKS.map(d => `<th>${d.name}</th>`).join("")}<th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Total geral</td>${DRINKS.map(d => `<td>${totals[d.id]}</td>`).join("")}<td>${grand}</td></tr></tfoot>
      </table>`;
  }

  function exportCsv() {
    if (!state.orders.length) return toast("Nada para exportar");
    const header = ["dia", "hora", "bebida", "cliente", "status"];
    const lines = [...state.orders]
      .sort((a, b) => a.time.localeCompare(b.time))
      .map(o => [formatDay(o.day), formatTime(o.time), drinkById(o.drink).name, o.customer, o.done ? "pronto" : "pendente"]
        .map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
    const blob = new Blob(["﻿" + [header.join(","), ...lines].join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `pedidos-cafe-${localDay()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  let toastTimer;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  $("drinks").addEventListener("click", e => {
    const btn = e.target.closest("[data-drink]");
    if (btn) addOrder(btn.dataset.drink);
  });
  $("orders").addEventListener("click", e => {
    const toggle = e.target.closest("[data-toggle]");
    const del = e.target.closest("[data-delete]");
    if (toggle) {
      const o = state.orders.find(o => o.id === toggle.dataset.toggle);
      if (o) o.done = !o.done;
    } else if (del) {
      if (!confirm("Remover este pedido?")) return;
      state.orders = state.orders.filter(o => o.id !== del.dataset.delete);
    } else return;
    save();
    render();
  });
  $("hideDone").addEventListener("change", render);
  dayInput.addEventListener("change", render);
  $("today").addEventListener("click", () => { dayInput.value = localDay(); render(); });
  $("exportCsv").addEventListener("click", exportCsv);
  $("clearDay").addEventListener("click", () => {
    const day = dayInput.value;
    const n = ordersFor(day).length;
    if (!n) return toast("Nenhum pedido neste dia");
    if (!confirm(`Apagar ${n} pedido(s) de ${formatDay(day)}?`)) return;
    state.orders = state.orders.filter(o => o.day !== day);
    save();
    render();
  });

  render();
</script>
</body>
</html>
