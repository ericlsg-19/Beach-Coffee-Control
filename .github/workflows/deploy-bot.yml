name: Deploy Telegram bot

# Runs the bot tests and deploys the Cloudflare Worker.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts + D1 edit)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["telegram-bot/**", ".github/workflows/deploy-bot.yml"]

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_TOKEN != 'true'
        working-directory: .
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy. Add the repository secrets to enable it."
      - uses: actions/checkout@v5
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - name: Apply schema
        if: env.HAS_TOKEN == 'true'
        run: npm run db:schema
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: npm run deploy
      - name: Health check
        if: env.HAS_TOKEN == 'true'
        # The public address is WEBHOOK_URL in wrangler.toml (our own domain once it's set).
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$(sed -n 's/^WEBHOOK_URL = "\(.*\)"/\1/p' wrangler.toml)/health"
