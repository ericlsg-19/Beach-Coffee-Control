name: Deploy Telegram bot

# Runs the bot tests and deploys the Cloudflare Worker.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts + D1 edit)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["telegram-bot/**", ".github/workflows/deploy-bot.yml"]

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy. Add the repository secrets to enable it."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: Apply schema and deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telegram-bot
          wranglerVersion: "3.114.0"
          command: |
            d1 execute beach-coffee-bot --remote --file schema.sql
            deploy
      - name: Health check
        if: env.HAS_TOKEN == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://beach-coffee-bot.beachcoffeeco.workers.dev/health
