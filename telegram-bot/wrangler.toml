name = "beach-coffee-bot"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[vars]
# Receives tips and coffee bag payments (USDC on Solana). Leave empty to turn them off.
# Drinks are free: order receipts never show payment details.
SOLANA_ADDRESS = "WTxV6GDprgz2vHT4gX4ULCexqqaXYKQ8zWpZoYJHz2u"
# Price of the Island DAO Limited Edition coffee bag, in USDC.
BAG_PRICE_USDC = "10"
# Where Telegram delivers updates; the scheduled check re-registers it if lost.
WEBHOOK_URL = "https://beach-coffee-bot.beachcoffeeco.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "beach-coffee-bot"
database_id = "27fa6662-7253-4d3b-b9b2-ca84f776ae0f"

# Keep request logs in the Cloudflare dashboard (Workers → beach-coffee-bot → Logs).
[observability]
enabled = true

# Every minute: check the Telegram webhook and look for tip / bag payments on Solana. 02:00 UTC (23:00 Floripa): daily report.
[triggers]
crons = ["* * * * *", "0 2 * * *"]
